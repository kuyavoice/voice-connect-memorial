<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — SIGNAL LOST | ボイスコネクトメモリアル</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      background: #060913;
      color: #fff;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      text-align: center;
      padding: 2rem;
    }
    .tag {
      background: #87CEEB;
      color: #060913;
      font-weight: 700;
      letter-spacing: .25em;
      font-size: .8rem;
      padding: .35rem 1rem .35rem 1.15rem;
      clip-path: polygon(0 0, 100% 0, calc(100% - .8rem) 100%, 0 100%);
      position: relative;
    }
    h1 {
      font-size: clamp(4.5rem, 20vw, 9rem);
      font-weight: 800;
      font-style: italic;
      letter-spacing: .04em;
      line-height: 1;
      position: relative;
    }
    h1 span { color: #87CEEB; }
    .sub { letter-spacing: .5em; color: rgba(255,255,255,.45); font-size: .72rem; position: relative; padding-left: .5em; }
    p.jp { color: rgba(255,255,255,.78); font-size: .95rem; line-height: 2; position: relative; }
    a.back {
      margin-top: .9rem;
      display: inline-block;
      border: 1px solid #87CEEB;
      color: #87CEEB;
      text-decoration: none;
      letter-spacing: .25em;
      font-size: .8rem;
      font-weight: 600;
      padding: .75rem 1.7rem .75rem 1.9rem;
      clip-path: polygon(0 0, 100% 0, calc(100% - .8rem) 100%, 0 100%);
      transition: background .2s ease, color .2s ease;
      position: relative;
    }
    a.back:hover { background: #87CEEB; color: #060913; }
    .star { position: absolute; background: #fff; border-radius: 50%; animation: tw 3.2s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .star { animation: none; opacity: .4; } }
  </style>
</head>
<body>
  <span class="tag">VCM</span>
  <h1>4<span>0</span>4</h1>
  <div class="sub">SIGNAL LOST</div>
  <p class="jp">この声は、まだ届いていないようです。<br>星の繋がる場所へ、戻りましょう。</p>
  <a class="back" href="/voice-connect-memorial/">RETURN TO TOP →</a>
  <script>
    for (var i = 0; i < 70; i++) {
      var s = document.createElement("span");
      s.className = "star";
      var z = Math.random() * 2 + 1;
      s.style.width = s.style.height = z + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.animationDelay = (Math.random() * 3) + "s";
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
